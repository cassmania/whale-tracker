# Whale Tracker - GitHub Pages 자동 배포 워크플로우 (static.yml)
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# GITHUB_TOKEN에 Pages 배포 권한 부여 (Permissions)
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 제어 (Concurrency)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          # Pages가 활성화되지 않은 경우 자동으로 활성화 시도 (Enablement)
          enablement: true
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # 저장소 루트의 모든 정적 파일 배포 (index.html, style.css, app.js 등)
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
