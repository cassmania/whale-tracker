# Whale Tracker - GitHub Pages gh-pages 브랜치 자동 배포 워크플로우 (static.yml)
name: Deploy to GitHub Pages Branch

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# GITHUB_TOKEN에 gh-pages 브랜치 쓰기 권한 부여 (Permissions)
permissions:
  contents: write

# 동시 배포 제어 (Concurrency)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 소스 코드 가져오기 (Checkout)
      - name: Checkout
        uses: actions/checkout@v4

      # 2. gh-pages 브랜치로 정적 파일 배포 (Deploy to gh-pages)
      # 기술 설명: peaceiris/actions-gh-pages 액션을 사용하여 지정된 폴더의 콘텐츠를 gh-pages 브랜치로 푸시합니다.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: '.' # 루트 폴더의 정적 파일들을 배포 (index.html, style.css, app.js 등)
          publish_branch: gh-pages # 대상 배포 브랜치 (Target Branch)
